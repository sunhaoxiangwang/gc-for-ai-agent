# The workspace root is also a (never-published) package so the integration
# tests can live in `tests/` at the repository root, next to the code they
# describe rather than buried inside one crate.
[package]
name = "reap-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]

[dev-dependencies]
reap-core = { path = "crates/reap-core" }
reap-platform = { path = "crates/reap-platform" }
anyhow = "1.0"
proptest = "1.5"
tempfile = "3.13"

[workspace]
resolver = "2"
members = ["crates/reap-core", "crates/reap-platform", "crates/reap-cli"]
# Without this, a bare `cargo build` in a workspace whose root is itself a
# package builds only that root package, which here is the test harness.
default-members = [
    ".",
    "crates/reap-core",
    "crates/reap-platform",
    "crates/reap-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/reap"
homepage = "https://github.com/OWNER/reap"
authors = ["reap contributors"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
globset = "0.4"
hostname = "0.4"
humantime-serde = "1.1"
nix = { version = "0.29", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"

assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.5"
tempfile = "3.13"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
